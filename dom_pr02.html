  <script>
    const arr = new Array();
    arr[0] = 11;
    arr[1] = 21;
    arr[2] = 35;

    fruits.unshift('orange02');

    fruits.push('strawbarry');

    fruits.shift();

    fruits.pop();
    
    let index = fruits.indexOf('mango');

    fruits.splice(index, 1);
    fruits.splice(index,0, 'banana');

    for(let fruit of fruits){

    let userEmail = prompt('이메일 주소 입력(abcd@abcd.com형식)');
    let arrUrl = ['.co.kr','.com','.go.kr','.or.kr'];
    let check1 = false;
    let check2 = false;

    if(userEmail.indexOf('@')>= 0){
      check1 = true;
    }
    for(let i=0;i<arrUrl.length;i++){
      if(userEmail.indexOf(arrUrl[i])>0)check2 = true;
