    //async = Promise의 resolve

    async function order() {
      let menu = 'coffee';
      return menu;
    }
    async function display(result) {
      return `Thank you, ${result}`;
    }
    async function init() {
      const response = await order();
      const result = await display(response);
      console.log(result);
    }
    init();
    //처음 실행 init
    //async-await 짝지, await = resolve역할 + then역할
