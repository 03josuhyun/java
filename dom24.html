  </script>
  <style>
    /*---------------default_setting----------------*/
    * {
      margin: 0;
      padding: 0;
    }

    li {
      list-style: none;
    }

    a {
      color: black;
      text-decoration: none;
    }

    /*----------------------------------------------*/
    table {
      width: 400px;
      margin-bottom: 10px;
    }

    table,
    th,
    td {
      border: 1px solid black;
      border-spacing: 0;
    }

    th {
      width: 80px;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script>
    async function init() {
      const response = await fetch('https://jsonplaceholder.typicode.com/users')
      const users = await response.json();
      display(users);
    }
    function display(users) {
      const root = document.getElementById('root');
      let output = '';
      users.forEach((user) => {
        output += `
        <table>
          <tr>
            <th>이름</th>
            <td>${user.name}</td>
          </tr>
          <tr>
            <th>아이디</th>
            <td>${user.username}</td>
          </tr>
          <tr>
            <th>이메일</th>
            <td>${user.email}</td>
          </tr>
          <tr>
            <th>주소</th>
            <td>${user.address.city}</td>
          </tr>
          <tr>
            <th>회사이름</th>
            <td>${user.company.name}</td>
          </tr>
        </table>
        `
      });//users.forEach
      root.innerHTML = output;
    }
    init();
  </script>
</body>

</html>
