<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScrtip</title>
  <script>
    //인라인 방식의 이벤트 처리 방법 - React에서는 필수 기능
    // function showBox(){
    //   document.querySelector('.box').style.display = 'block';
    // }
    // function hiddenBox(){
    //   document.querySelector('.box').style.display = 'none';
    // }
    //js로 팝업 닫기

    document.addEventListener('DOMContentLoaded', function(){
      //객체를 변수로 등록
      const showBtn = document.querySelector('.show_btn');
      const hiddenBtn = document.querySelector('.hidden_btn');
      const textBox = document.querySelector('.box');

      /*showBtn.addEventListener('click',function(){
        textBox.style.display = 'block';
      });
      hiddenBtn.addEventListener('click', () => {
        textBox.style.display = 'none';
      });*/

      showBtn.onclick = showBox;
      hiddenBtn.onlick = hiddenBox;

      function showBox() {
        textBox.style.display = 'block';
      }
      function hiddenBox() {
        textBox.style.display = 'none';
      }
    });//DOMcontentLoaded
  </script>
  <style>
    /*--------------default_setting---------------*/
    * {margin: 0; padding: 0;}
    li{list-style: none;}
    a {color: black; text-decoration: none;}
    /*--------------------------------------------*/
    .box {
      width: 300px; height: 300px;
      border: 1px solid black;
      background-color: #eee;
      font-size: 30px;
      text-align: center;
      line-height: 300px;
      display: none;
    }
  </style>
</head>
<body>
  <!-- <button class="show_btn" onclick="showBox()">show</button>
  <button class="hidden_btn" onclick="hiddenBox()">hidden</button>inline은 로딩 과정이 필요가없음 -->

  <button class="show_btn">show</button>
  <button class="hidden_btn">hidden</button>

  <p class="box">Text_box</p>
</body>
</html>
