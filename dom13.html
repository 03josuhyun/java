<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dom13</title>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const totalTerms = document.getElementById('total_terms');
      const termsEls = document.querySelectorAll('.terms_el');
      const terms01 = document.getElementById('terms01');
      const terms02 = document.getElementById('terms02');
      const terms03 = document.getElementById('terms03');

      totalTerms.addEventListener('click', totalCheck);
      terms01.addEventListener('click', termsCheck);
      terms02.addEventListener('click', termsCheck);
      terms03.addEventListener('click', termsCheck);

      function totalCheck() {
        // if(totalTerms.checked === true){
        //   terms01.checked = true;
        //   terms02.checked = true;
        //   terms03.checked = true;
        // }else {
        //   terms01.checked = false;
        //   terms02.checked = false;
        //   terms03.checked = false;
        // }

        // if (totalTerms.checked) {
        //   for (let termsEl of termsEls) {
        //     termsEl.checked = true;
        //   }
        // } else {
        //   for (let termsEl of termsEls) {
        //     termsEl.checked = false;
        //   }
        // }
        //of는 값자체만 을 받는것/in은 첨자를 받는 것
        //배열은 s를 붙임, 배열안에 있는 값은 단수로

        if (totalTerms.checked === true) {
          termsEls.forEach(termsEl => {
            termsEl.checked = true;
          })
        } else {
          termsEls.forEach(termsEl => {
            termsEl.checked = false;
          })
        }
        //es6문법
      }
      //totalCheck

      function termsCheck(){
        if(terms01.checked && terms02.checked && terms03.checked) {
          totalTerms.checked = true;
        }else {
          totalTerms.checked = false;
        }
      }
      //termsCheck
    });
  </script>
  <style>
    /*---------------default_setting----------------*/
    * {
      margin: 0;
      padding: 0;
    }

    li {
      list-style: none;
    }

    a {
      color: black;
      text-decoration: none;
    }

    /*----------------------------------------------*/
    .total_text {
      font-size: 12px;
      color: #666;
    }
  </style>
</head>

<body>
  <form action="">
    <fieldset>
      <legend>약관동의</legend>
      <ul>
        <li>
          <input type="checkbox" id="total_terms">
          <label for="total_terms">전체약관 동의</label><!--접근성을 높임-->
          <div class="total_text">
            <p>실명 인증된 아이디로 가입, 위치기반 서비스 이용약관(선택), 이벤트·혜택 정보 수신(선택) 동의를 포함합니다.</p>
          </div>
        </li>
        <li>
          <input type="checkbox" id="terms01" class="terms_el">
          <span>첫번째 약관동의</span>
          <div class="terms01_text">
            <p>제1조 목적</p>
            <p>본 이용약관은 "사이트명(이하 '사이트')의 서비스의 이용조건과 운영에 관한 제반사항 규정을 목적으로 합니다"</p>
          </div>
        </li>
        <li>
          <input type="checkbox" id="terms02" class="terms_el">
          <span>두번째 약관동의</span>
        </li>
        <li>
          <input type="checkbox" id="terms03" class="terms_el">
          <span>세번째 약관동의</span>
        </li>
      </ul>
    </fieldset>
  </form>
</body>

</html>
