<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScrtip</title>
  <script>
    // document.getElementById('box01').style.color = 'red';
    // window.onload = function() {
    //   document.getElementById('box01').style.color = 'blue'
    // }//window.onload를 사용해야 로딩이 안되어도 적용할 수 있음, 옛날에 많이 사용했음
    // $(function(){
    //   $(document).ready(function() {});
    // }); 위의 window.onload와 동일한 의미

    document.addEventListener('DOMContentLoaded', function(){
      document.getElementById('box01').style.color= 'green';
      document.getElementById('box01').style.fontSize = '24px';
      document.getElementById('box01').style.fontWeight = 'bold';

      document.getElementsByClassName('box02')[0].style.color = 'red';//class는 배열로 사용해서 지정해야 적용됨, 클래스는 중복 사용이 가능하기 때문에, 하나밖에 없어도 배열 사용해야함
      document.getElementsByTagName('li')[1].style.color = 'blue';//li또한 배열을 넣어야함

      document.querySelector('#box01').style.backgroundColor = '#eee';
      document.querySelector('.box02').style.backgroundColor = '#ccc';
      document.querySelectorAll('.box03 li')[2].style.backgroundColor = 'yellow';//복수일때 all로 사용

      const li = document.querySelectorAll('.box03 li');

      for (let i=0; i<li.length; i++){
        li[i].style.fontSize = '30px'
      }
      li.forEach(function(value){
        value.style.color = 'pink';
      }); 
      //숫자 카운터를 해줄 필요가 없음, 배열함수,value가 li를 카운터, foreach 배열함수
      li.forEach((value)=> {
        value.style.backgroundColor = 'green';
      });//function = => 동일함, 이것은 this, 모든걸 바꿜 쓸 수없음
    });//DOMContentLoaded 이벤트 이름, 요즘 이벤트 처리 방법, Elements는 복수이기에 배열
    
  </script>
  <style>
    /*--------------default_setting---------------*/
    * {margin: 0; padding: 0;}
    li{list-style: none;}
    a {color: black; text-decoration: none;}
    /*--------------------------------------------*/
  </style>
</head>
<body>
  <div id="box01">Text_box01</div>
  <div class="box02">Text_box02</div>
  <ul class="box03">
    <li>Text_box03_1</li>
    <li>Text_box03_2</li>
    <li>Text_box03_3</li>
  </ul>
  <!-- <script>
    document.getElementById('box01').style.color = 'red';
    로딩이 되고 난 다음에 작동이 됨 그렇기 때문에 dom 밑에 있어야 적용이 됨
  </script> -->
</body>
</html>
