<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>js09</title>
  <script>
    document.addEventListener('DOMContentLoaded',function(){
      let newDiv = document.createElement('div');
      let newText = document.createTextNode('Hellow,JavaScript');
      // let attr = document.createAttribute('class'); 필요없음
      
      newDiv.appendChild(newText);
      //변수라서 '' x
      document.body.appendChild(newDiv);
      newDiv.setAttribute('class', 'front');
    });//동적콘텐츠를 사용하는 방법, 안에 자식부터 차곡차곡 쌓아서 하기
  </script>
  <style>
    /*---------------default_setting--------------*/
    * {margin: 0; padding: 0;}
    li{list-style: none;}
    a {color: black; text-decoration: none;}
    /*--------------------------------------------*/
    .front {
      font-size: 50px;
      color: red;
    }/**/
  </style>
</head>
<body>
  
</body>
</html>
