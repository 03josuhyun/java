    //promise 실행 결과가 resolve이면 then, reject이면 catch를 받음, finally는 무조건 한번 실행됨(=default와 비슷함)
    //resolve : 데이터 처리가 문제가 없을 때 / reject : 데이터 처리에 문제가 생겼을 때 실행

    //인수가 하나일경우 가로 안해도 됨 but 오류 발생 가능성 있음

  </script>
  <style>
    /*---------------default_setting----------------*/
    * {margin: 0; padding: 0;}
    li{list-style: none;}
    a {color: black; text-decoration: none;}
    /*----------------------------------------------*/
    .active {
      text-decoration: line-through;
      color: #999;
    }
    .stop {
      width: 300px; height: 100px;
      text-align: center;
      line-height: 100px;
      font-size: 20px;
      background-color: white;
      color: black;
    }
  </style>
</head>
<body>
  
  <div class="start"></div>
  <div class="end"></div>
  <script>
    const order = new Promise((resolve, reject) => {
      let coffee = prompt('커피를 주문하세요', '아메리카노');
      if((coffee !== null) && (coffee !== '')){
        document.querySelector('.start').textContent = `${coffee}주문접수`;
        setTimeout(()=>{
          resolve(coffee);
        },2000);
      }
    });//promise resolve,reject

    function display(result){
      document.querySelector('.end').textContent = `${result} 준비완료`;
      document.querySelector('.start').classList.add('active');
      document.querySelector('.end').classList.add('stop');
    }
    function showErr(err){
      console.log(err);
    }

    order
    .then(display)
    .catch(showErr);
  </script>
</body>
</html>
